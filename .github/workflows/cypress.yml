name: Cypress E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install

      - name: Run Cypress Tests
        run: npx cypress run --browser chrome --headless
        continue-on-error: true

      - name: Upload videos and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.containers }}   # ← cada container tem nome diferente
          path: |
            cypress/videos/
            cypress/screenshots/
          retention-days: 15

      - name: Generate Mochawesome Report
        if: always()
        run: |
          npx mochawesome-merge cypress/reports/mochawesome/*.json > mochawesome.json || echo "No JSON files"
          npx marge mochawesome.json --reportDir mochawesome-report --inline || echo "Report generated with warnings"

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.containers }}   # ← AQUI ESTAVA O PROBLEMA! Agora cada container tem seu próprio relatório
          path: mochawesome-report/
          retention-days: 30
          